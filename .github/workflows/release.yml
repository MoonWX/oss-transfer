name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: cli-go/go.sum
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          project_version="$(sed -n 's/^[[:space:]]*<version>\([^<]*\)<\/version>.*/\1/p' pom.xml | head -n1)"
          test "$RELEASE_TAG" = "v$project_version"
      - name: Check publishing credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          JDOSS_AK: ${{ secrets.JDOSS_AK }}
          JDOSS_SK: ${{ secrets.JDOSS_SK }}
          JCR_USERNAME: ${{ secrets.JCR_USERNAME }}
          JCR_PASSWD: ${{ secrets.JCR_PASSWD }}
        run: |
          for name in DOCKER_USERNAME DOCKER_PAT JDOSS_AK JDOSS_SK JCR_USERNAME JCR_PASSWD; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
      - name: Build release
        run: ./build.sh
      - name: Docker Agent smoke test
        run: |
          docker build --build-arg TARGETARCH=amd64 -t oss-transfer:ci .
          python3 deploy/tests/docker-agent-smoke.py --image oss-transfer:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            output/oss-transfer.tar.gz
            output/oss-transfer.tar.gz.sha256
            output/oss-transfer/
          retention-days: 7
  docker:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: output
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Log in to JD Cloud JCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: moonwx-cn-north-1.jcr.service.jdcloud.com
          username: ${{ secrets.JCR_USERNAME }}
          password: ${{ secrets.JCR_PASSWD }}
      - name: Docker Hub tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: moonwx/osstransfer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Push Docker Hub image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: JCR tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: jcr_metadata
        with:
          images: moonwx-cn-north-1.jcr.service.jdcloud.com/osstransfer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Push JCR image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ${{ steps.jcr_metadata.outputs.tags }}
          labels: ${{ steps.jcr_metadata.outputs.labels }}
          cache-from: type=gha
          provenance: false
          sbom: false
      - name: Verify JCR architectures and pull access
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          JCR_IMAGE: moonwx-cn-north-1.jcr.service.jdcloud.com/osstransfer
        run: |
          image="$JCR_IMAGE:${RELEASE_TAG#v}"
          docker buildx imagetools inspect "$image" --raw > jcr-manifest.json
          jq -e '.mediaType == "application/vnd.docker.distribution.manifest.list.v2+json" and
            ([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]' \
            jcr-manifest.json > /dev/null
          docker pull --platform linux/amd64 "$image"
          docker pull --platform linux/arm64 "$image"
  oss:
    name: JD Cloud OSS
    needs: [package, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: output
      - name: Publish version and latest artifacts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.JDOSS_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.JDOSS_SK }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash deploy/publish-oss.sh "$RELEASE_TAG"
  release:
    needs: [package, docker, oss]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: output
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" = *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" output/oss-transfer.tar.gz output/oss-transfer.tar.gz.sha256 --clobber
            if [[ "$RELEASE_TAG" = *-* ]]; then
              gh release edit "$RELEASE_TAG" "${release_flags[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" output/oss-transfer.tar.gz output/oss-transfer.tar.gz.sha256 \
              --verify-tag --title "OSS Transfer $RELEASE_TAG" --generate-notes "${release_flags[@]}"
          fi
