openapi: 3.0.3
info:
  title: Transfer Tools Local Transfer API
  version: 1.0.0
  description: Backend-only contract for eligible-node OSS/local transfers over explicitly declared shared storage. Content verification is not part of this version.
paths:
  /api/master/tasks/{taskId}/bandwidth-limit:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getTaskBandwidthLimit
      responses:
        '200': { $ref: '#/components/responses/JsonSuccess' }
        '404': { $ref: '#/components/responses/JsonError' }
        '503': { $ref: '#/components/responses/JsonError' }
    put:
      operationId: setTaskBandwidthLimit
      description: Saves and applies a shared task limit. Check data.applied; HTTP 200 may include incomplete per-node application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limitMbps]
              properties:
                limitMbps: { $ref: '#/components/schemas/TaskBandwidthLimitMbps' }
      responses:
        '200': { $ref: '#/components/responses/JsonSuccess' }
        '400': { $ref: '#/components/responses/JsonError' }
        '404': { $ref: '#/components/responses/JsonError' }
        '409': { $ref: '#/components/responses/JsonError' }
        '503': { $ref: '#/components/responses/JsonError' }
  /api/master/local-nodes:
    get:
      operationId: listLocalNodes
      responses:
        '200': { $ref: '#/components/responses/JsonSuccess' }
  /api/master/local-transfers:
    post:
      operationId: createLocalTransfers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/LocalTransferRequest' }
      responses:
        '200': { $ref: '#/components/responses/JsonSuccess' }
        '400': { $ref: '#/components/responses/JsonError' }
        '502': { $ref: '#/components/responses/JsonError' }
  /api/master/local-transfers/validate:
    post:
      operationId: validateMasterLocalBindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/LocalTransferRequest' }
      responses:
        '200': { $ref: '#/components/responses/JsonSuccess' }
        '400': { $ref: '#/components/responses/JsonError' }
        '502': { $ref: '#/components/responses/JsonError' }
  /api/master/local-transfers/status:
    get:
      operationId: aggregateLocalTransferStatus
      parameters:
        - { name: taskId, in: query, description: "Public top-level task ID; LOCAL worker shard IDs are internal and may be negative.", schema: { type: integer } }
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/TransferDirection' } }
        - { name: executionNodeIp, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, RUNNING, LIST_DONE, COMPLETED, PARTIAL_FAILED, FAILED, STOPPED] } }
        - { name: endpoint, in: query, schema: { type: string } }
        - { name: storageId, in: query, description: Optional filter for storage labels supplied by existing API clients., schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/JsonSuccess' }
  /api/master/local-transfers/failures:
    get:
      operationId: aggregateLocalTransferFailures
      parameters:
        - { name: taskId, in: query, schema: { type: integer } }
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/TransferDirection' } }
        - { name: executionNodeIp, in: query, schema: { type: string } }
        - { name: endpoint, in: query, schema: { type: string } }
        - { name: storageId, in: query, description: Optional filter for storage labels supplied by existing API clients., schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200': { $ref: '#/components/responses/JsonSuccess' }
  /api/master/local-transfers/stop:
    post: { operationId: stopLocalTransfers, requestBody: { $ref: '#/components/requestBodies/TaskSelection' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '409': { $ref: '#/components/responses/JsonError' } } }
  /api/master/local-transfers/retry-failures:
    post: { operationId: retryLocalTransferFailures, requestBody: { $ref: '#/components/requestBodies/TaskSelection' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '409': { $ref: '#/components/responses/JsonError' } } }
  /api/master/local-transfers/report:
    get: { operationId: downloadMasterLocalTransferReport, responses: { '200': { description: ZIP containing task-summary.csv and exception-details.csv, headers: { Content-Disposition: { schema: { type: string } } }, content: { application/zip: { schema: { type: string, format: binary } } } }, '500': { $ref: '#/components/responses/JsonError' } } }
  /api/worker/local-capabilities:
    get: { operationId: getWorkerLocalCapabilities, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /api/worker/local-transfers/validate:
    post: { operationId: validateWorkerLocalPath, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocalTransferRequest' } } } }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '400': { $ref: '#/components/responses/JsonError' } } }
  /api/worker/local-transfers:
    post: { operationId: acceptWorkerLocalTransfers, requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LocalTransferRequest' } } } } }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '400': { $ref: '#/components/responses/JsonError' }, '409': { $ref: '#/components/responses/JsonError' } } }
  /api/worker/local-transfers/discover:
    post: { operationId: startWorkerLocalDiscovery, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocalTransferRequest' } } } }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '400': { $ref: '#/components/responses/JsonError' } } }
  /api/worker/local-transfers/batches:
    post: { operationId: acceptWorkerLocalBatch, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocalFileBatch' } } } }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '400': { $ref: '#/components/responses/JsonError' }, '409': { $ref: '#/components/responses/JsonError' } } }
  /api/worker/local-transfers/status:
    get:
      operationId: getWorkerLocalTransferStatus
      parameters:
        - { name: taskId, in: query, schema: { type: integer } }
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/TransferDirection' } }
        - { name: executionNodeIp, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: endpoint, in: query, schema: { type: string } }
        - { name: storageId, in: query, description: Optional filter for storage labels supplied by existing API clients., schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/JsonSuccess' } }
  /api/worker/local-transfers/failures:
    get:
      operationId: getWorkerLocalTransferFailures
      parameters:
        - { name: taskId, in: query, schema: { type: integer } }
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/TransferDirection' } }
        - { name: executionNodeIp, in: query, schema: { type: string } }
        - { name: endpoint, in: query, schema: { type: string } }
        - { name: storageId, in: query, description: Optional filter for storage labels supplied by existing API clients., schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses: { '200': { $ref: '#/components/responses/JsonSuccess' } }
  /api/worker/local-transfers/stop:
    post: { operationId: stopWorkerLocalTransfers, requestBody: { $ref: '#/components/requestBodies/TaskSelection' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /api/worker/local-transfers/retry-failures:
    post: { operationId: retryWorkerLocalTransferFailures, requestBody: { $ref: '#/components/requestBodies/TaskSelection' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /api/worker/local-transfers/report:
    get: { operationId: downloadWorkerLocalTransferReport, responses: { '200': { description: ZIP report, content: { application/zip: { schema: { type: string, format: binary } } } } } }
components:
  schemas:
    TaskBandwidthLimitMbps:
      type: number
      format: double
      nullable: true
      minimum: 0.1
      maximum: 1000000
      description: Shared migration payload rate in decimal Mbps; null removes the additional task limit. Node limits still apply. One OSS creation shares this limit across its generated tasks.
    EndpointType:
      type: string
      enum: [OSS, LOCAL]
    TransferDirection:
      type: string
      enum: [OSS_TO_OSS, OSS_TO_LOCAL, LOCAL_TO_OSS]
    ConflictPolicy:
      type: string
      enum: [SKIP, OVERWRITE]
    DistributionMode:
      type: string
      enum: [affinity, balanced]
    LocalNodeBinding:
      type: object
      required: [executionNodeIp, localPath]
      properties:
        executionNodeIp: { type: string }
        localPath: { type: string }
    TransferEndpoint:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/EndpointType' }
        s3Alias: { type: string, description: References stored S3 configuration; credentials are never returned. }
        bucket: { type: string }
        objectKey: { type: string }
        prefix: { type: string }
        executionNodeIp: { type: string }
        localPath: { type: string }
        storageId:
          type: string
          nullable: true
          description: Optional compatibility label retained in task records and reports. May be omitted for single-node and multi-node transfers; it does not control routing or verify shared storage identity.
        nodeBindings:
          type: array
          description: Explicit worker and path bindings. Multiple bindings must expose the same data namespace; validation checks accessibility but cannot prove shared storage identity. New LOCAL_TO_OSS uploads of a FILE require exactly one binding; multiple FILE bindings fail validation and creation with SINGLE_FILE_REQUIRES_ONE_NODE.
          items: { $ref: '#/components/schemas/LocalNodeBinding' }
    LocalTransferRequest:
      type: object
      required: [direction, sourceEndpoint, destinationEndpoint]
      properties:
        taskId: { type: integer, readOnly: true, description: "Public globally increasing top-level task ID." }
        parentTaskId: { type: integer, readOnly: true, description: "Same public ID shared by all internal shards." }
        direction: { $ref: '#/components/schemas/TransferDirection' }
        sourceEndpoint: { $ref: '#/components/schemas/TransferEndpoint' }
        destinationEndpoint: { $ref: '#/components/schemas/TransferEndpoint' }
        conflictPolicy: { $ref: '#/components/schemas/ConflictPolicy', default: SKIP }
        taskBandwidthLimitMbps: { $ref: '#/components/schemas/TaskBandwidthLimitMbps' }
        dateAfter: { type: string }
        dateBefore: { type: string }
        targetRelativePath: { type: string }
        distributionMode:
          allOf: [{ $ref: '#/components/schemas/DistributionMode' }]
          description: New LOCAL_TO_OSS requests always derive the effective mode from source bindings, overriding a valid explicit value; one binding uses affinity and multiple directory bindings use balanced. Saved tasks retain their mode on resume. OSS_TO_LOCAL preserves an explicit value; if omitted, it defaults to balanced for multiple LOCAL bindings and affinity otherwise.
      example:
        direction: OSS_TO_LOCAL
        sourceEndpoint: { type: OSS, s3Alias: source, bucket: videos, objectKey: 2026/movie.mp4 }
        destinationEndpoint:
          type: LOCAL
          nodeBindings:
            - { executionNodeIp: 10.0.0.11, localPath: /mnt/shared/import }
            - { executionNodeIp: 10.0.0.12, localPath: /data/shared/import }
        distributionMode: balanced
        conflictPolicy: SKIP
    LocalFileEntry:
      type: object
      required: [relativeKey, size, lastModified]
      properties:
        relativeKey: { type: string }
        size: { type: integer, format: int64 }
        lastModified: { type: integer, format: int64 }
    LocalFileBatch:
      type: object
      required: [parentTaskId, shardId, shardIndex, request, nodeBinding, entries]
      properties:
        parentTaskId: { type: integer }
        shardId: { type: string, description: "Stable internal shard identity; its numeric worker task ID is not public." }
        shardIndex: { type: integer }
        attempt: { type: integer, default: 0 }
        discoveryWorker: { type: string }
        request: { $ref: '#/components/schemas/LocalTransferRequest' }
        nodeBinding: { $ref: '#/components/schemas/LocalNodeBinding' }
        entries: { type: array, items: { $ref: '#/components/schemas/LocalFileEntry' } }
        lastBatch: { type: boolean }
    ApiResponse:
      type: object
      required: [success, code, message]
      properties:
        success: { type: boolean }
        code: { type: string, enum: [OK, INVALID_DIRECTION, INVALID_ENDPOINT, INVALID_SOURCE_SELECTION, INVALID_DISTRIBUTION_MODE, DUPLICATE_NODE_BINDING, NO_ELIGIBLE_WORKER, SHARD_ASSIGNMENT_MISMATCH, S3_CONFIG_NOT_FOUND, S3_BUCKET_UNAVAILABLE, WORKER_NOT_CONFIGURED, WORKER_UNAVAILABLE, LOCAL_PATH_NOT_ABSOLUTE, LOCAL_PATH_NOT_FOUND, LOCAL_PATH_NOT_READABLE, LOCAL_PATH_NOT_WRITABLE, LOCAL_PATH_UNSAFE, TASK_STOPPED, INTERNAL_ERROR] }
        message: { type: string }
        data: { type: object, nullable: true }
  requestBodies:
    TaskSelection:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              taskIds: { type: array, items: { type: integer } }
              itemKeys: { type: array, items: { type: string } }
  responses:
    JsonSuccess:
      description: Successful JSON envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } }
    JsonError:
      description: Stable error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } }
