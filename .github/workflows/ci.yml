name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  console:
    name: Console (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Console build and tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chrome
          npm test -- --workers=2 --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: console-results-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 3
  server:
    name: Server, CLI and deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build console resources for server tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: cli-go/go.sum
      - name: Server tests
        run: mvn --batch-mode verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: server-test-results
          path: target/surefire-reports/TEST-*.xml
          retention-days: 3
      - name: CLI tests
        working-directory: cli-go
        run: go test ./...
      - name: Workflow checks
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Deployment and package checks
        run: |
          find deploy -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash deploy/tests/test-build-package.sh
          bash deploy/tests/test-cli-launcher.sh
          bash deploy/tests/deploy-ssh-port-test.sh
          python3 deploy/tests/deploy-runtime-test.py
          bash deploy/tests/test-docker-entrypoint.sh
          python3 deploy/tests/test-publish-oss.py
          python3 deploy/tests/test-install-version.py
