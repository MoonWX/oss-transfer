server.port: ${OSS_TRANSFER_PORT:1685}
transfer.port: ${OSS_TRANSFER_PORT:1685}
transfer.role: ${TRANSFER_ROLE:master}
transfer.master-ip: ${TRANSFER_MASTER_IP:127.0.0.1}
transfer.local-ip: ${TRANSFER_LOCAL_IP:127.0.0.1}
transfer.worker-ips: ${TRANSFER_WORKER_IPS:127.0.0.1}
transfer.master-web-url: ${TRANSFER_MASTER_WEB_URL:http://localhost:1685}
