services:
  master:
    image: ${OSS_TRANSFER_IMAGE:-moonwx/osstransfer:4.0.1}
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    ports:
      - "${OSS_TRANSFER_BIND_ADDRESS:-0.0.0.0}:${OSS_TRANSFER_PORT:-1685}:${OSS_TRANSFER_PORT:-1685}"
    environment:
      TRANSFER_ROLE: master
      TRANSFER_MASTER_WEB_URL: ${TRANSFER_MASTER_WEB_URL:-http://localhost:1685}
      OSS_TRANSFER_PORT: ${OSS_TRANSFER_PORT:-1685}
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx1024m}
    volumes:
      - master-data:/app/data
      - ${OSS_TRANSFER_FILES_DIR:-./files}:/data
volumes:
  master-data:
