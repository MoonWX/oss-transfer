name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: cli-go/go.sum
      - name: Console build and tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chrome
          npm test -- --workers=2
      - name: Server tests
        run: mvn --batch-mode verify
      - name: CLI tests
        working-directory: cli-go
        run: go test ./...
      - name: Deployment and package checks
        run: |
          find deploy -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash deploy/tests/test-build-package.sh
          bash deploy/tests/test-cli-launcher.sh
          bash deploy/tests/deploy-ssh-port-test.sh
          python3 deploy/tests/deploy-runtime-test.py
          bash deploy/tests/test-docker-entrypoint.sh
