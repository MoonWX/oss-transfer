name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      package_id: ${{ steps.package.outputs.artifact-id }}
      image_id: ${{ steps.image.outputs.artifact-id }}
      package_sha256: ${{ steps.identity.outputs.package_sha256 }}
      image_sha256: ${{ steps.identity.outputs.image_sha256 }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: cli-go/go.sum
      - name: Build installation package once
        run: ./build.sh
      - name: Check concurrent storage configuration synchronization
        run: mvn -q -Dtest=StorageSynchronizationRaceTest test
      - name: Check package identity and workflow syntax
        id: version
        run: |
          (cd output && sha256sum --check oss-transfer.tar.gz.sha256)
          mkdir "$RUNNER_TEMP/package-under-test"
          tar -xzf output/oss-transfer.tar.gz -C "$RUNNER_TEMP/package-under-test"
          # Test the bytes shipped in the tar, not a separate build directory.
          rm -rf output/oss-transfer
          mv "$RUNNER_TEMP/package-under-test/oss-transfer" output/oss-transfer
          test -s output/oss-transfer/oss-transfer.jar
          test -s output/oss-transfer/agent-bundle.tar.gz
          test -x output/oss-transfer/oss-transfer-cli-amd64
          test -x output/oss-transfer/oss-transfer-cli-arm64
          (cd output/oss-transfer && sha256sum --check agent-bundle.tar.gz.sha256)
          mkdir "$RUNNER_TEMP/agent-bundle-under-test"
          tar -xzf output/oss-transfer/agent-bundle.tar.gz -C "$RUNNER_TEMP/agent-bundle-under-test"
          for file in oss-transfer.jar oss-transfer-cli-amd64 oss-transfer-cli-arm64 VERSION; do
            cmp "output/oss-transfer/$file" "$RUNNER_TEMP/agent-bundle-under-test/$file"
          done
          version="$(sed -n 's/^[[:space:]]*<version>\([^<]*\)<\/version>.*/\1/p' pom.xml | head -n1)"
          test "$(sed -n 's/^Version: //p' output/oss-transfer/VERSION)" = "$version"
          test "$(sed -n 's/^Commit: //p' output/oss-transfer/VERSION)" = "$(git rev-parse --short HEAD)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
          bash -n build.sh
          find output/oss-transfer/deploy "$RUNNER_TEMP/agent-bundle-under-test/deploy" -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Install image archive tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        id: buildx
      - name: Build both image architectures from the same package
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=output/oss-transfer-image.tar,oci-mediatypes=false
          tags: moonwx/osstransfer:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Verify the actual image archive
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd output && sha256sum oss-transfer-image.tar > oss-transfer-image.tar.sha256)
          bash deploy/verify-release-image.sh "v$BUILD_VERSION" output --ci-build
      - name: Record artifact identity
        id: identity
        run: |
          printf 'package_sha256=%s\n' "$(sha256sum output/oss-transfer.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'image_sha256=%s\n' "$(sha256sum output/oss-transfer-image.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # These are candidates until BOTH native acceptance jobs pass.
      # Release also requires successful push/main CI for this exact commit.
      - name: Upload installation package for acceptance
        id: package
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            output/oss-transfer.tar.gz
            output/oss-transfer.tar.gz.sha256
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Upload image archive for acceptance
        id: image
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: |
            output/oss-transfer-image.tar
            output/oss-transfer-image.tar.sha256
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  acceptance:
    name: Full acceptance (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            machine: x86_64
          - arch: arm64
            runner: ubuntu-26.04-arm
            machine: aarch64
    env:
      ACCEPTANCE_ARCH: ${{ matrix.arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
      PACKAGE_SHA256: ${{ needs.build.outputs.package_sha256 }}
      IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 10
        with:
          artifact-ids: ${{ needs.build.outputs.package_id }},${{ needs.build.outputs.image_id }}
          merge-multiple: true
          path: output
      - name: Verify and unpack the build artifacts
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          (cd output && sha256sum --check oss-transfer.tar.gz.sha256 && sha256sum --check oss-transfer-image.tar.sha256)
          printf '%s  %s\n' "$PACKAGE_SHA256" output/oss-transfer.tar.gz "$IMAGE_SHA256" output/oss-transfer-image.tar | sha256sum --check
          tar -xzf output/oss-transfer.tar.gz -C output
          test "$(sed -n 's/^Commit: //p' output/oss-transfer/VERSION)" = "$(git rev-parse --short HEAD)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare independent acceptance clients
        run: |
          python3 -m venv "$RUNNER_TEMP/acceptance-venv"
          "$RUNNER_TEMP/acceptance-venv/bin/pip" install -r .github/acceptance/requirements.txt
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Load the native image from the verified archive
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
          skopeo --command-timeout 3m --override-os linux --override-arch "$ACCEPTANCE_ARCH" copy \
            oci-archive:output/oss-transfer-image.tar "docker-archive:$RUNNER_TEMP/acceptance.tar:oss-transfer:acceptance"
          docker load --input "$RUNNER_TEMP/acceptance.tar"
          rm -f "$RUNNER_TEMP/acceptance.tar"
          test "$(docker image inspect oss-transfer:acceptance --format '{{.Architecture}}')" = "$ACCEPTANCE_ARCH"
          test "$(docker image inspect oss-transfer:acceptance --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker run --rm --entrypoint uname oss-transfer:acceptance -m)" = "$EXPECTED_MACHINE"
          mkdir -p "output/acceptance/$ACCEPTANCE_ARCH"
          python3 - <<'PYTHON'
          import json, os, platform
          from pathlib import Path
          evidence = {"machine": platform.machine(), "architecture": os.environ["ACCEPTANCE_ARCH"],
                      "commit": os.environ["GITHUB_SHA"], "packageSha256": os.environ["PACKAGE_SHA256"],
                      "imageSha256": os.environ["IMAGE_SHA256"]}
          Path("output/acceptance/" + os.environ["ACCEPTANCE_ARCH"] + "/artifact-identity.json").write_text(json.dumps(evidence, indent=2))
          PYTHON
      - name: Test one-click native and Compose installation
        timeout-minutes: 8
        run: |
          python3 .github/acceptance/quick-install.py --package output/oss-transfer \
            --image oss-transfer:acceptance --evidence "output/acceptance/$ACCEPTANCE_ARCH"
      - name: Test real transfers, UI, CLI and recovery
        timeout-minutes: 12
        run: |
          "$RUNNER_TEMP/acceptance-venv/bin/python" .github/acceptance/run.py \
            --image oss-transfer:acceptance --evidence "output/acceptance/$ACCEPTANCE_ARCH"
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-evidence-${{ matrix.arch }}
          path: output/acceptance/
          overwrite: true
          if-no-files-found: ignore
          retention-days: 7
