# Optional container deployment. For native services, use install.sh (the default).
services:
  master:
    image: ${OSS_TRANSFER_IMAGE:-moonwx/osstransfer:latest}
    restart: unless-stopped
    ports:
      - "${TRANSFER_PORT:-1685}:1685"
    volumes:
      - master-data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    stop_grace_period: 45s

  # To install an Agent, use the Docker join command from Nodes > Add node.
  # It creates a separate Compose project; this profile is for a pre-enrolled data volume.
  agent:
    profiles: [agent]
    image: ${OSS_TRANSFER_IMAGE:-moonwx/osstransfer:latest}
    command: [oss-transfer-agent, --data-dir, /data]
    restart: unless-stopped
    volumes:
      - agent-data:/data
      # The host directory must exist and permit UID 65532 to read/write.
      - type: bind
        source: ${TRANSFER_LOCAL_ROOT:-./transfer-files}
        target: /files
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    stop_grace_period: 45s

volumes:
  master-data:
  agent-data:
