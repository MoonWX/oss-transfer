transfer.role: master
transfer.agent.package-path: ./agent-bundle.tar.gz
# 迁移临时目录，如果迁移对象出错，该对象会降级为硬盘中转模式
transfer.tmp-dir: ./data/tmp-objects/

# 迁移模式：auto（自动降级），url（预签名模式，不降级），disk（硬盘模式）
transfer.mode: auto

# 精简元数据
transfer.cleanMetadata: true

# 仅打印，不执行
transfer.dryRun: false

# 统一集群服务端口；可通过 OSS_TRANSFER_PORT、transfer.port 或 server.port 覆盖。
server.port: ${transfer.port:1685}

# 登录认证配置
auth.default.username: admin
# 仅首次初始化使用；网页修改密码后，重启不会被此值覆盖。
auth.default.password: ${OSS_TRANSFER_BOOTSTRAP_PASSWORD:}
# 找回密码时临时启用，重启生效后应改回 false。
auth.default.reset-password-on-startup: false
auth.token.expire: 86400000

# 分布式协同模式的主节点IP
transfer.master-ip: 127.0.0.1
# Worker网页跳转到此固定公开地址（仅 http(s) origin，不含路径/参数）。
# 每台节点配置同一地址；留空时使用 http://transfer.master-ip:实际服务端口。
# transfer.master-web-url: https://transfer.example.com

# 分布式协同模式的工作节点IP
transfer.worker-ips:
  - 127.0.0.1

# 当前节点IP
transfer.local-ip: 127.0.0.1
transfer.port: ${OSS_TRANSFER_PORT:1685}
# 节点间共享密钥（内部调用认证）：主节点调用 worker 接口时附加 X-Internal-Token 头
# 各节点必须一致；部署时由 deploy.sh 自动生成，本地开发可自行指定
transfer.internal-token: ${OSS_TRANSFER_INTERNAL_TOKEN:}
# 仅用于节点能力展示，可在“执行节点→编辑节点”持久修改。不是文件访问白名单；
# 未声明不代表禁止本地迁移。当前版本没有 local.allowed-roots 配置，实际可访问范围
# 由运行账号权限和路径安全预检决定；任务仍必须指定绝对路径。
transfer.advertised-local-roots: []
# 共享存储可按节点声明逻辑存储ID及本机挂载路径，例如：
# transfer.advertised-local-bindings[0].storage-id: shared-storage
# transfer.advertised-local-bindings[0].local-path: /mnt/shared/data

# LOCAL共享存储小文件并发及发现批次上限
local-transfer.small-file-concurrency: 64
local-transfer.batch.max-items: 1000
local-transfer.batch.max-bytes: 4194304
local-transfer.completion-write-batch: 500

# 日志配置
logging.path: ./data/logs
logging.file: ${logging.path}/transfer-tools.log

# 探索源bucket线程的个数
thread-count.src.explore: 64
# list源bucket线程个数
thread-count.src.list: 64
# put目标bucket线程个数
thread-count.dest.put: 1024
# 分片上传线程个数。该线程池使用严格背压，不会让Put线程绕过上限执行分片
thread-count.dest.part: 16

# 每次list源bucket的最大对象数量
src.list.max-keys: 1000
# 迁移服务每批次处理的对象数量
src.list.batch-size: 1000
# 缓冲队列大小
buffer-queue.explore.size: 1000
buffer-queue.list.size: 1000000
buffer-queue.put.size: 1000000
buffer-queue.progress.size: 100000
buffer-queue.failed.size: 100000
buffer-queue.fallback.size: 100000

# list源bucket限速
rate-limit.src.qps.list: 100
# put目标bucket限速
rate-limit.dest.qps.put: 1400
# head目标bucket限速
rate-limit.dest.qps.head: 2800
# 带宽限速
rate-limit.bandwidth: 2000000000

# 限速自动调整配置
rate-limit.auto-adjust.increase-factor: 1.2
rate-limit.auto-adjust.interval-ms: 10000
rate-limit.auto-adjust.reduce-factor: 0.9
rate-limit.auto-adjust.max-retry-on-503: 3
rate-limit.auto-adjust.retry-delay-ms: 500
rate-limit.auto-adjust.min-put-qps: 200
rate-limit.auto-adjust.consecutive-503-threshold: 20

# 触发分片上传的阈值
dest.multipart.threshold: 33554432
# 每个分片的大小
dest.multipart.partsize: 33554432
# 单个大对象允许同时提交但尚未完成的最大分片数，防止4GB以上对象一次提交全部分片
dest.multipart.max-in-flight-parts-per-object: 4

# S3客户端连接池配置
connection-pool.max-connections: 5000
connection-pool.connection-timeout: 8000
connection-pool.socket-timeout: 180000
connection-pool.connection-max-idle-millis: 60000
connection-pool.use-expect-continue: false
connection-pool.use-reaper: true
connection-pool.max-error-retry: 1
