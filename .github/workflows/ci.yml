name: CI
on:
  push:
    branches: [main]
  pull_request:
    paths: ['install.sh', 'build.sh', 'Dockerfile', 'docker-compose.yml', '.dockerignore', 'cmd/**', 'internal/**', 'go.mod', 'go.sum', 'VERSION', 'scripts/build.sh', 'scripts/sync-installer-source.py', '.github/actions/**', 'deploy/native/**', 'docs/migration.md', 'frontend/**', 'cli/**', '.github/acceptance/**', '.github/tests/**', '.github/scripts/resolve-ci-artifacts.py', '.github/workflows/ci.yml', '.github/workflows/release.yml', 'deploy/verify-release-image.sh']
  workflow_dispatch:
    inputs:
      freebsd_arm64:
        description: Run only the full FreeBSD ARM64 suite
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Build packages and test programs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      reuse_tests: ${{ steps.reuse.outputs.reuse_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse passing tests for a version-only change
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/resolve-ci-artifacts.py --check-reuse
      - name: Record FreeBSD ARM64 acceptance scope
        env:
          QA_FREEBSD_ARM64: ${{ inputs.freebsd_arm64 && 'true' || 'false' }}
        run: |
          if [[ "$QA_FREEBSD_ARM64" = true ]]; then
            echo 'Only the full FreeBSD ARM64 runtime suite is enabled. Other platform suites and the image build are not scheduled.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'FreeBSD ARM64: runtime acceptance is not scheduled. Its archive remains in the release build matrix.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli/go.sum
      - run: npm ci --prefix frontend
      - name: Check translations and preserve message parameters
        if: steps.reuse.outputs.reuse_tests != 'true'
        run: npm run test:messages --prefix frontend
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Reject corrupt or ambiguous release packages
        run: |
          python3 -m pip install -r .github/acceptance/requirements.txt
          python3 scripts/sync-installer-source.py --check
          python3 .github/tests/test-source-selection.py -v
          python3 .github/tests/test-download-source.py -v
          python3 .github/tests/test-installer-startup.py -v
          python3 .github/tests/test-packaging.py -v
          python3 .github/tests/test-oss-layout.py -v
          python3 .github/tests/test-migrate-oss-prefix.py -v
          python3 .github/tests/test-resolve-ci-artifacts.py -v
          python3 .github/tests/test-binaries.py -v
          python3 .github/tests/test-cluster-diagnostics.py -v
          python3 .github/tests/test-platform-runner.py -v
          python3 .github/tests/test-host-s3.py -v
          python3 .github/tests/test-docker-cleanup.py -v
      - name: Build all candidate archives once
        env:
          AGENT_ARTIFACT_BASE: https://moonwx.s3.cn-north-1.jdcloud-oss.com/oss-transfer
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo 'The build source changed before packaging.' >&2
            exit 1
          fi
          BUILD_PLATFORMS="$(python3 deploy/native/platforms.py --list)"
          export BUILD_PLATFORMS
          AGENT_ARTIFACT_VERSION="v$(cat VERSION)" AGENT_DOCKER_IMAGE="moonwx/osstransfer:$(cat VERSION)" bash scripts/build.sh
      - name: Check the packaged program versions
        run: |
          smoke_dir="$(mktemp -d)"
          tar -xzf output/packages/oss-transfer-linux-amd64.tar.gz -C "$smoke_dir"
          version="$(cat VERSION)"
          commit="$(git rev-parse --short HEAD)"
          for program in master agent cli; do
            identity="$("$smoke_dir/oss-transfer-linux-amd64/oss-transfer-$program" --version)"
            printf '%s\n' "$identity"
            [[ "$identity" == *"$version"* && "$identity" == *"$commit"* ]]
          done
      - name: Compile target tests alongside the release packages
        if: steps.reuse.outputs.reuse_tests != 'true'
        env:
          QA_FREEBSD_ARM64: ${{ inputs.freebsd_arm64 && 'true' || 'false' }}
        run: |
          python3 - <<'PYTHON'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import os
          import runpy
          import subprocess
          import sys

          helper = Path('.github/acceptance/test-binaries.py')
          platforms = runpy.run_path(str(helper))['SUPPORTED']
          arm64_only = os.environ['QA_FREEBSD_ARM64'] == 'true'
          platforms = [platform for platform in platforms if (platform == 'freebsd/arm64') == arm64_only]

          def compile_tests(platform):
              subprocess.run([
                  sys.executable, str(helper), 'build', '--platform', platform,
                  '--output', 'output/test-binaries/' + platform.replace('/', '-'),
              ], check=True)

          with ThreadPoolExecutor(max_workers=2) as pool:
              list(pool.map(compile_tests, platforms))
          PYTHON
      - name: Assemble versioned native download assets
        run: python3 deploy/native/release-assets.py --packages output/packages --output output/release-assets --version "$(cat VERSION)" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            output/packages/*.tar.gz
            output/packages/*.zip
            output/packages/*.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: output/release-assets/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.reuse.outputs.reuse_tests != 'true' && !inputs.freebsd_arm64
        with:
          name: test-binaries-linux-armv7
          path: output/test-binaries/linux-armv7/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.reuse.outputs.reuse_tests != 'true' && !inputs.freebsd_arm64
        with:
          name: test-binaries-linux-riscv64
          path: output/test-binaries/linux-riscv64/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.reuse.outputs.reuse_tests != 'true' && !inputs.freebsd_arm64
        with:
          name: test-binaries-linux-loong64
          path: output/test-binaries/linux-loong64/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.reuse.outputs.reuse_tests != 'true' && !inputs.freebsd_arm64
        with:
          name: test-binaries-freebsd-amd64
          path: output/test-binaries/freebsd-amd64/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.reuse.outputs.reuse_tests != 'true' && inputs.freebsd_arm64
        with:
          name: test-binaries-freebsd-arm64
          path: output/test-binaries/freebsd-arm64/
          if-no-files-found: error
          retention-days: 7
  image:
    if: inputs.freebsd_arm64 != true
    name: Build container image
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: output/packages
      - name: Prepare the verified native binary context
        id: release
        run: |
          python3 deploy/native/docker-context.py --packages output/packages --output output/docker-context
          printf 'version=%s\n' "$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        id: buildx
      - name: Archive both image architectures without rebuilding binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: output/docker-context
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=output/oss-transfer-image.tar,oci-mediatypes=false
          tags: moonwx/osstransfer:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          sbom: false
      - name: Verify the archived image identities
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
          (cd output && sha256sum oss-transfer-image.tar > oss-transfer-image.tar.sha256)
          bash deploy/verify-release-image.sh "v$(cat VERSION)" output --ci-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: |
            output/oss-transfer-image.tar
            output/oss-transfer-image.tar.sha256
          if-no-files-found: error
          retention-days: 7
  native:
    if: needs.package.outputs.reuse_tests != 'true' && !inputs.freebsd_arm64
    name: Native ${{ matrix.platform }}
    needs: [package, image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, arch: amd64, runner: ubuntu-latest, race: '-race'}
          - {platform: linux/arm64, arch: arm64, runner: ubuntu-26.04-arm, race: '-race'}
          - {platform: darwin/amd64, runner: macos-15-intel, race: '-race'}
          - {platform: darwin/arm64, runner: macos-latest, race: '-race'}
          - {platform: windows/amd64, runner: windows-latest, race: '-race'}
          - {platform: windows/arm64, runner: windows-11-arm, race: ''}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: output/packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'Linux'
        with:
          name: release-image
          path: output
      - name: Verify packages and prepare pinned S3 service
        env:
          QA_PLATFORM: ${{ matrix.platform }}
        run: |
          python -m pip install -r .github/acceptance/requirements.txt
          python .github/acceptance/prepare.py --platform "$QA_PLATFORM" --directory "$RUNNER_TEMP/native-package"
      - name: Load the verified image and prepare the Compose installer
        if: runner.os == 'Linux'
        env:
          QA_ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
          python deploy/native/verify-image.py --archive output/oss-transfer-image.tar --version "$(cat VERSION)" --commit "$GITHUB_SHA"
          skopeo --command-timeout 3m --override-os linux --override-arch "$QA_ARCH" copy \
            oci-archive:output/oss-transfer-image.tar "docker-archive:$RUNNER_TEMP/image.tar:oss-transfer:qa"
          docker load --input "$RUNNER_TEMP/image.tar"
          test "$(docker image inspect oss-transfer:qa --format '{{.Architecture}}')" = "$QA_ARCH"
          test "$(docker image inspect oss-transfer:qa --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          OSS_TRANSFER_IMAGE=oss-transfer:qa docker compose -f docker-compose.yml config --quiet
          python deploy/native/package.py --packages output/packages --output "$RUNNER_TEMP/installer-release"
      - name: Check execution, administration and service lifecycle
        env:
          QA_PLATFORM: ${{ matrix.platform }}
          RACE_FLAG: ${{ matrix.race }}
        run: |
          args=(--platform "$QA_PLATFORM" --output "$RUNNER_TEMP/acceptance")
          if [[ -n "$RACE_FLAG" ]]; then args+=(--race); fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=(--docker-image oss-transfer:qa --installer-manifest "$RUNNER_TEMP/installer-release/manifest.tsv")
          fi
          python .github/acceptance/run-platform.py "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/acceptance/platform/evidence.json
            ${{ runner.temp }}/acceptance/platform/*.log
            ${{ runner.temp }}/acceptance/unit/evidence.json
            ${{ runner.temp }}/acceptance/unit/*.log
            ${{ runner.temp }}/acceptance/smoke/evidence.json
            ${{ runner.temp }}/acceptance/smoke/*.log
            ${{ runner.temp }}/acceptance/cli/evidence.json
            ${{ runner.temp }}/acceptance/cli/*.log
            ${{ runner.temp }}/acceptance/cluster/evidence.json
            ${{ runner.temp }}/acceptance/cluster/bandwidth-samples.json
            ${{ runner.temp }}/acceptance/cluster/*.log
            ${{ runner.temp }}/acceptance/install/evidence.json
            ${{ runner.temp }}/acceptance/install/*-install-*.log
            ${{ runner.temp }}/acceptance/inventory/evidence.json
            ${{ runner.temp }}/acceptance/inventory/*.log
            ${{ runner.temp }}/acceptance/docker/evidence.json
            ${{ runner.temp }}/acceptance/docker/image-provenance.json
            ${{ runner.temp }}/acceptance/docker/*.log
            ${{ runner.temp }}/acceptance/setup/evidence.json
            ${{ runner.temp }}/acceptance/setup/*.log
          if-no-files-found: ignore
          retention-days: 7
  emulated:
    if: needs.package.outputs.reuse_tests != 'true' && !inputs.freebsd_arm64
    name: Linux ${{ matrix.arch }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: armv7, interpreter: arm}
          - {arch: riscv64, interpreter: riscv64}
          - {arch: loong64, interpreter: loongarch64}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: packages
          path: output/packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: test-binaries-linux-${{ matrix.arch }}
          path: output/test-binaries
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Enable the target CPU interpreter
        env:
          QA_INTERPRETER: ${{ matrix.interpreter }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user qemu-user-binfmt binfmt-support
          if [[ -f "/var/lib/binfmts/qemu-$QA_INTERPRETER" ]]; then
            sudo update-binfmts --enable "qemu-$QA_INTERPRETER"
          else
            sudo systemctl restart systemd-binfmt
          fi
          grep -q enabled "/proc/sys/fs/binfmt_misc/qemu-$QA_INTERPRETER"
          python -m pip install -r .github/acceptance/requirements.txt
      - name: Verify target application and test binaries
        env:
          QA_ARCH: ${{ matrix.arch }}
        run: |
          python .github/acceptance/prepare.py --platform "linux/$QA_ARCH" --fixture-platform linux/amd64 --directory "$RUNNER_TEMP/emulated-package"
          python .github/acceptance/test-binaries.py verify --platform "linux/$QA_ARCH" --directory output/test-binaries --repo "$GITHUB_WORKSPACE"
      - name: Check execution, administration and service lifecycle
        env:
          QA_ARCH: ${{ matrix.arch }}
        run: python .github/acceptance/run-platform.py --platform "linux/$QA_ARCH" --test-binaries output/test-binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: emulated-evidence-${{ matrix.arch }}
          path: |
            output/platform/evidence.json
            output/platform/*.log
            output/smoke/evidence.json
            output/smoke/*.log
            output/cluster/evidence.json
            output/cluster/bandwidth-samples.json
            output/cluster/*.log
            output/unit/evidence.json
            output/unit/*.log
            output/cli/evidence.json
            output/cli/*.log
            output/inventory/evidence.json
            output/inventory/*.log
            output/install/evidence.json
            output/install/*-install-*.log
          if-no-files-found: ignore
          retention-days: 7
  freebsd:
    if: needs.package.outputs.reuse_tests != 'true'
    name: FreeBSD ${{ matrix.arch }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.freebsd_arm64 && '["arm64"]' || '["amd64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: packages
          path: output/packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: test-binaries-freebsd-${{ matrix.arch }}
          path: output/test-binaries
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Start the native host S3 fixture
        run: |
          python -m pip install -r .github/acceptance/requirements.txt
          python .github/acceptance/host-s3.py start --directory "$RUNNER_TEMP/freebsd-host-s3" --guest-host 192.168.122.2
          install -m 600 "$RUNNER_TEMP/freebsd-host-s3/config.json" output/host-s3-config.json
          cp "$RUNNER_TEMP/freebsd-host-s3/provenance.json" output/freebsd-host-s3.json
      - name: Keep only the guest platform archive
        env:
          QA_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          archive = 'oss-transfer-freebsd-' + os.environ['QA_ARCH'] + '.tar.gz'
          keep = {archive, archive + '.sha256'}
          directory = Path('output/packages')
          for name in keep:
              if not (directory / name).is_file():
                  raise SystemExit('Missing guest archive: ' + name)
          for path in directory.iterdir():
              if path.name not in keep:
                  path.unlink()
          PYTHON
      - name: Run target acceptance in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        env:
          QA_ARCH: ${{ matrix.arch }}
        with:
          cache-after-prepare: true
          cache-after-prepare-key-suffix: ${{ hashFiles('.github/acceptance/requirements.txt') }}
          release: '14.4'
          arch: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          cpu: ${{ matrix.arch == 'arm64' && '2' || '' }}
          copyback: false
          envs: QA_ARCH GITHUB_SHA
          prepare: |
            set -e
            pkg install -y bash curl python311 ca_root_nss
            python3.11 -m venv /opt/oss-transfer-ci-venv
            /opt/oss-transfer-ci-venv/bin/python -m pip install -r .github/acceptance/requirements.txt
          run: |
            status=0
            sh -e <<'TESTS' || status=$?
            py=/opt/oss-transfer-ci-venv/bin/python
            if [ "$QA_ARCH" = arm64 ]; then export GOMAXPROCS=2; fi
            "$py" - <<'PYTHON'
            import json, os, platform, subprocess
            from pathlib import Path
            details = {"system": platform.system(), "release": platform.release(),
                       "architecture": platform.machine(), "cpuCount": os.cpu_count(),
                       "hwNcpu": int(subprocess.check_output(["sysctl", "-n", "hw.ncpu"], text=True).strip()),
                       "gomaxprocs": os.environ.get("GOMAXPROCS")}
            Path("output/freebsd-guest-diagnostics.json").write_text(json.dumps(details, indent=2) + "\n")
            PYTHON
            export OSS_TRANSFER_QA_S3_CONFIG="$PWD/output/host-s3-config.json"
            "$py" .github/acceptance/prepare.py --platform "freebsd/$QA_ARCH" --directory /tmp/oss-transfer-package --external-s3-fixture
            "$py" .github/acceptance/test-binaries.py verify --platform "freebsd/$QA_ARCH" --directory output/test-binaries --repo "$PWD" --env-file /tmp/oss-qa-tests.env
            . /tmp/oss-qa-tests.env
            "$py" .github/acceptance/run-platform.py --platform "freebsd/$QA_ARCH" --test-binaries output/test-binaries --bin-dir /tmp/oss-transfer-package
            TESTS
            mkdir -p output
            printf '%s\n' "$status" > output/freebsd-exit-code
      - name: Record host virtualization diagnostics
        if: always()
        env:
          QA_VM_ARCH: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
        run: |
          python3 - <<'PYTHON'
          import fcntl, json, os, platform, shutil, subprocess
          from pathlib import Path
          details = {"system": platform.system(), "release": platform.release(),
                     "architecture": platform.machine(), "cpuCount": os.cpu_count(),
                     "nproc": int(subprocess.check_output(["nproc"], text=True).strip())}
          binary = shutil.which("qemu-system-" + os.environ["QA_VM_ARCH"])
          details["qemuVersion"] = (subprocess.check_output([binary, "--version"], text=True).splitlines()[0]
                                    if binary else None)
          kvm = {"deviceExists": Path("/dev/kvm").exists(), "opened": False, "vmCreated": False}
          try:
              with open("/dev/kvm", "r+b", buffering=0) as device:
                  kvm["opened"] = True
                  kvm["apiVersion"] = fcntl.ioctl(device, 0xAE00, 0)
                  vm = fcntl.ioctl(device, 0xAE01, 0)
                  os.close(vm)
                  kvm["vmCreated"] = True
          except OSError as error:
              kvm["error"] = str(error)
          details["kvm"] = kvm
          details["qemuProcesses"] = []
          for path in Path("/proc").glob("[0-9]*/cmdline"):
              try:
                  args = path.read_bytes().decode().rstrip("\0").split("\0")
              except (OSError, UnicodeError):
                  continue
              if not args or not Path(args[0]).name.startswith("qemu-system-"):
                  continue
              settings = {key: args[args.index(key) + 1] for key in ("-smp", "-accel", "-cpu", "-machine")
                          if key in args and args.index(key) + 1 < len(args)}
              details["qemuProcesses"].append({"executable": Path(args[0]).name, "settings": settings})
          Path("output").mkdir(exist_ok=True)
          Path("output/freebsd-host-diagnostics.json").write_text(json.dumps(details, indent=2) + "\n")
          PYTHON
      - name: Copy back only acceptance evidence
        if: always()
        run: |
          mkdir -p output
          rsync -a --timeout=120 --rsync-path=/usr/local/bin/rsync \
            -e 'ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=4' \
            --include='/freebsd-exit-code' --include='/freebsd-guest-diagnostics.json' \
            --include='/platform/' --include='/platform/evidence.json' --include='/platform/*.log' \
            --include='/smoke/' --include='/smoke/evidence.json' --include='/smoke/*.log' \
            --include='/cluster/' --include='/cluster/evidence.json' --include='/cluster/bandwidth-samples.json' --include='/cluster/*.log' \
            --include='/unit/' --include='/unit/evidence.json' --include='/unit/*.log' \
            --include='/cli/' --include='/cli/evidence.json' --include='/cli/*.log' \
            --include='/inventory/' --include='/inventory/evidence.json' --include='/inventory/*.log' \
            --include='/install/' --include='/install/evidence.json' --include='/install/*-install-*.log' \
            --exclude='*' \
            "freebsd:$GITHUB_WORKSPACE/output/" output/
      - name: Stop the host S3 fixture
        if: always()
        run: python .github/acceptance/host-s3.py stop --directory "$RUNNER_TEMP/freebsd-host-s3"
      # Copy diagnostics back before enforcing the test result.
      - name: Require successful FreeBSD acceptance
        run: test "$(cat output/freebsd-exit-code)" = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: freebsd-evidence-${{ matrix.arch }}
          path: |
            output/freebsd-exit-code
            output/freebsd-host-s3.json
            output/freebsd-host-diagnostics.json
            output/freebsd-guest-diagnostics.json
            output/platform/evidence.json
            output/platform/*.log
            output/smoke/evidence.json
            output/smoke/*.log
            output/cluster/evidence.json
            output/cluster/bandwidth-samples.json
            output/cluster/*.log
            output/unit/evidence.json
            output/unit/*.log
            output/cli/evidence.json
            output/cli/*.log
            output/inventory/evidence.json
            output/inventory/*.log
            output/install/evidence.json
            output/install/*-install-*.log
          if-no-files-found: ignore
          retention-days: 7
