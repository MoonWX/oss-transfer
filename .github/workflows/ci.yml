name: CI
on:
  push:
    branches: [main]
  pull_request:
    paths: ['install.sh', 'build.sh', 'Dockerfile', 'docker-compose.yml', '.dockerignore', 'cmd/**', 'internal/**', 'go.mod', 'go.sum', 'VERSION', 'scripts/build-go.sh', 'scripts/sync-installer-source.py', '.github/actions/**', 'deploy/go/**', 'docs/go-migration.md', 'frontend/**', 'cli-go/**', '.github/acceptance/**', '.github/tests/**', '.github/scripts/resolve-ci-artifacts.py', '.github/workflows/ci.yml', '.github/workflows/release.yml', 'deploy/verify-release-image.sh']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli-go/go.sum
      - run: npm ci --prefix frontend
      - name: Check translations and preserve message parameters
        run: npm run test:messages --prefix frontend
      - name: Reject corrupt or ambiguous release packages
        run: |
          python3 scripts/sync-installer-source.py --check
          python3 .github/tests/test-source-selection.py -v
          python3 .github/tests/test-download-source.py -v
          python3 .github/tests/test-go-packaging.py -v
          python3 .github/tests/test-go-oss-layout.py -v
          python3 .github/tests/test-resolve-ci-artifacts.py -v
          python3 .github/tests/test-go-test-binaries.py -v
          python3 .github/tests/test-go-cluster-diagnostics.py -v
      - name: Build all candidate archives once
        env:
          GO_AGENT_ARTIFACT_BASE: https://moonwx.s3.cn-north-1.jdcloud-oss.com/osstransfer
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo 'The build source changed before packaging.' >&2
            exit 1
          fi
          GO_PLATFORMS="$(python3 deploy/go/platforms.py --list)"
          export GO_PLATFORMS
          GO_AGENT_ARTIFACT_VERSION="v$(cat VERSION)" GO_AGENT_DOCKER_IMAGE="moonwx/osstransfer:$(cat VERSION)" bash scripts/build-go.sh
      - name: Assemble versioned native download assets
        run: python3 deploy/go/release-assets.py --packages output/go-development --output output/go-release-assets --version "$(cat VERSION)" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-migration-packages
          path: |
            output/go-development/*.tar.gz
            output/go-development/*.zip
            output/go-development/*.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-release-assets
          path: output/go-release-assets/*
          if-no-files-found: error
          retention-days: 7
  test_binaries:
    name: Build tests ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/armv7, artifact: linux-armv7}
          - {platform: linux/riscv64, artifact: linux-riscv64}
          - {platform: linux/loong64, artifact: linux-loong64}
          - {platform: freebsd/amd64, artifact: freebsd-amd64}
          - {platform: freebsd/arm64, artifact: freebsd-arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli-go/go.sum
      - name: Cross-compile target tests and failure fixtures
        env:
          QA_PLATFORM: ${{ matrix.platform }}
        run: python3 .github/acceptance/go-test-binaries.py build --platform "$QA_PLATFORM" --output output/go-test-binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-test-binaries-${{ matrix.artifact }}
          path: output/go-test-binaries/
          if-no-files-found: error
          retention-days: 7
  image:
    name: Archive the two-platform Go image
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-migration-packages
          path: output/go-development
      - name: Prepare the verified native binary context
        id: release
        run: |
          python3 deploy/go/docker-context.py --packages output/go-development --output output/go-docker-context
          printf 'version=%s\n' "$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        id: buildx
      - name: Archive both image architectures without rebuilding binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: output/go-docker-context
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=output/oss-transfer-image.tar,oci-mediatypes=false
          tags: moonwx/osstransfer:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          sbom: false
      - name: Verify the archived image identities
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
          (cd output && sha256sum oss-transfer-image.tar > oss-transfer-image.tar.sha256)
          bash deploy/verify-release-image.sh "v$(cat VERSION)" output --ci-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-release-image
          path: |
            output/oss-transfer-image.tar
            output/oss-transfer-image.tar.sha256
          if-no-files-found: error
          retention-days: 7
  native:
    name: Native ${{ matrix.platform }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, runner: ubuntu-latest, race: '-race'}
          - {platform: linux/arm64, runner: ubuntu-26.04-arm, race: '-race'}
          - {platform: darwin/amd64, runner: macos-15-intel, race: '-race'}
          - {platform: darwin/arm64, runner: macos-latest, race: '-race'}
          - {platform: windows/amd64, runner: windows-latest, race: '-race'}
          - {platform: windows/arm64, runner: windows-11-arm, race: ''}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli-go/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-migration-packages
          path: output/go-development
      - name: Check durable execution and client behavior
        env:
          RACE_FLAG: ${{ matrix.race }}
        run: |
          race=()
          if [[ -n "$RACE_FLAG" ]]; then race+=("$RACE_FLAG"); fi
          go test "${race[@]}" ./...
          (cd cli-go && go test "${race[@]}" ./...)
      - name: Verify packages and prepare pinned S3 service
        env:
          QA_PLATFORM: ${{ matrix.platform }}
        run: |
          python -m pip install -r .github/acceptance/requirements.txt
          python .github/acceptance/prepare-go.py --platform "$QA_PLATFORM" --directory "$RUNNER_TEMP/go-native-package"
      - name: Run packaged Master and two Agents
        run: |
          "$GO_QA_MASTER" --version
          "$GO_QA_AGENT" --version
          "$GO_QA_CLI" --version
          python .github/acceptance/go-runtime-smoke.py --master "$GO_QA_MASTER" --agent "$GO_QA_AGENT" --output output/go-smoke \
            --expect-agent-release-url "https://moonwx.s3.cn-north-1.jdcloud-oss.com/osstransfer/v$(cat VERSION)" \
            --expect-agent-image "moonwx/osstransfer:$(cat VERSION)"
          python .github/acceptance/go-cli.py --master "$GO_QA_MASTER" --agent "$GO_QA_AGENT" --cli "$GO_QA_CLI" --output output/go-cli
          python .github/acceptance/go-cluster.py --master "$GO_QA_MASTER" --agent "$GO_QA_AGENT" --weed "$GO_QA_WEED" --output output/go-cluster --scenario all --multipart-recovery
          python .github/acceptance/go-inventory.py --master "$GO_QA_MASTER" --agent "$GO_QA_AGENT" --cli "$GO_QA_CLI" --weed "$GO_QA_WEED" --output output/go-inventory
      - name: Verify native service installation, upgrade and rollback
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            pwsh -NoProfile -File .github/tests/test-download-source.ps1
          else
            python .github/tests/test-source-selection.py -v
            python .github/tests/test-download-source.py -v
          fi
          python_path="$(python -c 'import sys; print(sys.executable)')"
          args=(.github/acceptance/go-install.py --master "$GO_QA_MASTER" --agent "$GO_QA_AGENT" --cli "$GO_QA_CLI" --output "$GITHUB_WORKSPACE/output/go-install" --repo "$GITHUB_WORKSPACE" --all-installed)
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo env "PATH=$PATH" "$python_path" "${args[@]}"
          else
            "$python_path" "${args[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-evidence-${{ strategy.job-index }}
          path: |
            output/go-smoke/evidence.json
            output/go-smoke/*.log
            output/go-cli/evidence.json
            output/go-cli/*.log
            output/go-cluster/evidence.json
            output/go-cluster/bandwidth-samples.json
            output/go-cluster/*.log
            output/go-install/evidence.json
            output/go-install/*-install-*.log
            output/go-inventory/evidence.json
            output/go-inventory/*.log
          if-no-files-found: ignore
          retention-days: 7
  emulated:
    name: Linux ${{ matrix.arch }} / ${{ matrix.suite }}
    needs: [package, test_binaries]
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7, riscv64, loong64]
        suite: [transfer, management]
        include:
          - {arch: armv7, interpreter: arm}
          - {arch: riscv64, interpreter: riscv64}
          - {arch: loong64, interpreter: loongarch64}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: go-migration-packages
          path: output/go-development
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: go-test-binaries-linux-${{ matrix.arch }}
          path: output/go-test-binaries
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Enable the target CPU interpreter
        env:
          QA_INTERPRETER: ${{ matrix.interpreter }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          sudo update-binfmts --enable "qemu-$QA_INTERPRETER"
          grep -q enabled "/proc/sys/fs/binfmt_misc/qemu-$QA_INTERPRETER"
          python -m pip install -r .github/acceptance/requirements.txt
      - name: Verify target application and test binaries
        env:
          QA_ARCH: ${{ matrix.arch }}
        run: |
          python .github/acceptance/prepare-go.py --platform "linux/$QA_ARCH" --fixture-platform linux/amd64 --directory "$RUNNER_TEMP/go-emulated-package"
          python .github/acceptance/go-test-binaries.py verify --platform "linux/$QA_ARCH" --directory output/go-test-binaries --repo "$GITHUB_WORKSPACE"
      - name: Check setup, transfers, shared limits and crash recovery
        if: matrix.suite == 'transfer'
        run: |
          python .github/acceptance/go-runtime-smoke.py --master "$GO_QA_MASTER" --agent "$GO_QA_AGENT" --output output/go-smoke \
            --expect-agent-release-url "https://moonwx.s3.cn-north-1.jdcloud-oss.com/osstransfer/v$(cat VERSION)" \
            --expect-agent-image "moonwx/osstransfer:$(cat VERSION)"
          python .github/acceptance/go-cluster.py --master "$GO_QA_MASTER" --agent "$GO_QA_AGENT" --weed "$GO_QA_WEED" --output output/go-cluster \
            --scenario all --multipart-recovery --multipart-test-binary "$GO_QA_MULTIPART_TEST_BINARY"
      - name: Run target Go and CLI tests
        if: matrix.suite == 'management'
        env:
          QA_ARCH: ${{ matrix.arch }}
        run: python .github/acceptance/go-test-binaries.py run --platform "linux/$QA_ARCH" --directory output/go-test-binaries --repo "$GITHUB_WORKSPACE" --output output/go-unit --parallel 2
      - name: Check CLI administration and inventory recovery
        if: matrix.suite == 'management'
        run: |
          python .github/acceptance/go-cli.py --master "$GO_QA_MASTER" --agent "$GO_QA_AGENT" --cli "$GO_QA_CLI" --output output/go-cli
          python .github/acceptance/go-inventory.py --master "$GO_QA_MASTER" --agent "$GO_QA_AGENT" --cli "$GO_QA_CLI" --weed "$GO_QA_WEED" --output output/go-inventory
      - name: Check real systemd installation, upgrade and rollback
        if: matrix.suite == 'management'
        env:
          QA_ARCH: ${{ matrix.arch }}
        run: |
          python_path="$(python -c 'import sys; print(sys.executable)')"
          sudo env "PATH=$PATH" "$python_path" .github/acceptance/go-install.py \
            --master "$GO_QA_MASTER" --agent "$GO_QA_AGENT" --cli "$GO_QA_CLI" \
            --output "$GITHUB_WORKSPACE/output/go-install" --repo "$GITHUB_WORKSPACE" --all-installed \
            --target-platform "linux/$QA_ARCH" --failure-master-fixture "$GO_QA_FAILURE_MASTER" --rollback-cli-fixture "$GO_QA_ROLLBACK_CLI"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: go-emulated-evidence-${{ matrix.arch }}-${{ matrix.suite }}
          path: |
            output/go-smoke/evidence.json
            output/go-smoke/*.log
            output/go-cluster/evidence.json
            output/go-cluster/bandwidth-samples.json
            output/go-cluster/*.log
            output/go-unit/evidence.json
            output/go-unit/*.log
            output/go-cli/evidence.json
            output/go-cli/*.log
            output/go-inventory/evidence.json
            output/go-inventory/*.log
            output/go-install/evidence.json
            output/go-install/*-install-*.log
          if-no-files-found: ignore
          retention-days: 7
  freebsd:
    name: FreeBSD ${{ matrix.arch }} / ${{ matrix.suite }}
    needs: [package, test_binaries]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        suite: [transfer, management]
        include:
          - {arch: amd64, vm_arch: x86_64}
          - {arch: arm64, vm_arch: aarch64}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: go-migration-packages
          path: output/go-development
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: go-test-binaries-freebsd-${{ matrix.arch }}
          path: output/go-test-binaries
      - name: Run target acceptance in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        env:
          QA_ARCH: ${{ matrix.arch }}
          QA_SUITE: ${{ matrix.suite }}
        with:
          cache-after-prepare: true
          cache-after-prepare-key-suffix: ${{ hashFiles('.github/acceptance/requirements.txt') }}
          release: '14.4'
          arch: ${{ matrix.vm_arch }}
          envs: QA_ARCH QA_SUITE GITHUB_SHA
          prepare: |
            set -e
            pkg install -y bash curl python311 ca_root_nss
            python3.11 -m venv /opt/oss-transfer-ci-venv
            /opt/oss-transfer-ci-venv/bin/python -m pip install -r .github/acceptance/requirements.txt
          run: |
            status=0
            sh -e <<'TESTS' || status=$?
            py=/opt/oss-transfer-ci-venv/bin/python
            "$py" .github/acceptance/prepare-go.py --platform "freebsd/$QA_ARCH" --directory /tmp/oss-transfer-package
            "$py" .github/acceptance/go-test-binaries.py verify --platform "freebsd/$QA_ARCH" --directory output/go-test-binaries --repo "$PWD" --env-file /tmp/oss-qa-tests.env
            . /tmp/oss-qa-tests.env
            bin=/tmp/oss-transfer-package
            if [ "$QA_SUITE" = transfer ]; then
              "$py" .github/acceptance/go-runtime-smoke.py --master "$bin/oss-transfer-master" --agent "$bin/oss-transfer-agent" --output output/go-smoke \
                --expect-agent-release-url "https://moonwx.s3.cn-north-1.jdcloud-oss.com/osstransfer/v$(cat VERSION)" \
                --expect-agent-image "moonwx/osstransfer:$(cat VERSION)"
              "$py" .github/acceptance/go-cluster.py --master "$bin/oss-transfer-master" --agent "$bin/oss-transfer-agent" --weed "$bin/weed" --output output/go-cluster \
                --scenario all --multipart-recovery --multipart-test-binary "$GO_QA_MULTIPART_TEST_BINARY"
            else
              "$py" .github/tests/test-source-selection.py -v
              "$py" .github/tests/test-download-source.py -v
              "$py" .github/acceptance/go-test-binaries.py run --platform "freebsd/$QA_ARCH" --directory output/go-test-binaries --repo "$PWD" --output output/go-unit --parallel 2
              "$py" .github/acceptance/go-cli.py --master "$bin/oss-transfer-master" --agent "$bin/oss-transfer-agent" --cli "$bin/oss-transfer-cli" --output output/go-cli
              "$py" .github/acceptance/go-inventory.py --master "$bin/oss-transfer-master" --agent "$bin/oss-transfer-agent" --cli "$bin/oss-transfer-cli" --weed "$bin/weed" --output output/go-inventory
              "$py" .github/acceptance/go-install.py --master "$bin/oss-transfer-master" --agent "$bin/oss-transfer-agent" --cli "$bin/oss-transfer-cli" \
                --repo "$PWD" --output "$PWD/output/go-install" --all-installed \
                --failure-master-fixture "$GO_QA_FAILURE_MASTER" --rollback-cli-fixture "$GO_QA_ROLLBACK_CLI"
            fi
            TESTS
            mkdir -p output
            printf '%s\n' "$status" > output/freebsd-exit-code
      # Copy diagnostics back before enforcing the test result.
      - name: Require successful FreeBSD acceptance
        run: test "$(cat output/freebsd-exit-code)" = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: go-freebsd-evidence-${{ matrix.arch }}-${{ matrix.suite }}
          path: |
            output/freebsd-exit-code
            output/go-smoke/evidence.json
            output/go-smoke/*.log
            output/go-cluster/evidence.json
            output/go-cluster/bandwidth-samples.json
            output/go-cluster/*.log
            output/go-unit/evidence.json
            output/go-unit/*.log
            output/go-cli/evidence.json
            output/go-cli/*.log
            output/go-inventory/evidence.json
            output/go-inventory/*.log
            output/go-install/evidence.json
            output/go-install/*-install-*.log
          if-no-files-found: ignore
          retention-days: 7
  docker:
    name: Docker ${{ matrix.platform }}
    needs: [package, image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, arch: amd64, runner: ubuntu-latest}
          - {platform: linux/arm64, arch: arm64, runner: ubuntu-26.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-migration-packages
          path: output/go-development
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-release-image
          path: output
      - name: Verify release archives and prepare native S3 service
        env:
          QA_PLATFORM: ${{ matrix.platform }}
        run: |
          python -m pip install -r .github/acceptance/requirements.txt
          python .github/acceptance/prepare-go.py --platform "$QA_PLATFORM" --directory "$RUNNER_TEMP/go-docker-package"
      - name: Load the native image from the verified release archive
        env:
          QA_ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
          python deploy/go/verify-image.py --archive output/oss-transfer-image.tar --version "$(cat VERSION)" --commit "$GITHUB_SHA"
          skopeo --command-timeout 3m --override-os linux --override-arch "$QA_ARCH" copy \
            oci-archive:output/oss-transfer-image.tar "docker-archive:$RUNNER_TEMP/go-image.tar:oss-transfer-go:qa"
          docker load --input "$RUNNER_TEMP/go-image.tar"
          test "$(docker image inspect oss-transfer-go:qa --format '{{.Architecture}}')" = "$QA_ARCH"
          test "$(docker image inspect oss-transfer-go:qa --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          OSS_TRANSFER_IMAGE=oss-transfer-go:qa docker compose -f docker-compose.yml config --quiet
      - name: Verify setup, enrollment, bind transfers and persistent identity
        run: python .github/acceptance/go-docker.py --image oss-transfer-go:qa --weed "$GO_QA_WEED" --output output/go-docker
      - name: Install Master and Agent through the public Compose wizard
        run: |
          python deploy/go/package.py --packages output/go-development --output "$RUNNER_TEMP/go-installer-release"
          python_path="$(python -c 'import sys; print(sys.executable)')"
          sudo env "PATH=$PATH" "$python_path" .github/acceptance/go-setup.py --installer install.sh \
            --manifest "$RUNNER_TEMP/go-installer-release/manifest.tsv" --image oss-transfer-go:qa --output output/go-setup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-docker-evidence-${{ matrix.arch }}
          path: |
            output/go-docker/evidence.json
            output/go-docker/image-provenance.json
            output/go-docker/*.log
            output/go-setup/evidence.json
            output/go-setup/*.log
          if-no-files-found: ignore
          retention-days: 7
