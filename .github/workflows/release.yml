name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  artifacts:
    name: Select verified CI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      ci_run_id: ${{ steps.select.outputs.ci_run_id }}
      package_artifact_id: ${{ steps.select.outputs.package_artifact_id }}
      image_artifact_id: ${{ steps.select.outputs.image_artifact_id }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version
        id: version
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?$ ]]
          project_version="$(cat VERSION)"
          test "$RELEASE_TAG" = "v$project_version"
          if [[ "$project_version" = *-* ]]; then
            IFS='.' read -r -a identifiers <<< "${project_version#*-}"
            for identifier in "${identifiers[@]}"; do [[ ! "$identifier" =~ ^0[0-9]+$ ]]; done
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Wait for CI and select its artifacts
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA="$(git rev-parse HEAD)" python3 .github/scripts/resolve-ci-artifacts.py
  docker_hub:
    name: Publish Docker Hub
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 10
        with:
          artifact-ids: ${{ needs.artifacts.outputs.image_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.artifacts.outputs.ci_run_id }}
          merge-multiple: true
          path: output
      - name: Install image transfer tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - name: Publish and verify Docker Hub image
        timeout-minutes: 20
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PAT }}
        run: bash deploy/publish-image.sh "$RELEASE_TAG" output
  oss:
    name: Publish JD Cloud OSS
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 10
        with:
          artifact-ids: ${{ needs.artifacts.outputs.package_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.artifacts.outputs.ci_run_id }}
          merge-multiple: true
          path: output
      - name: Check publishing tools
        run: |
          for tool in aws git tar openssl; do
            command -v "$tool" >/dev/null || { echo "Missing publishing tool: $tool" >&2; exit 1; }
          done
          aws --version 2>&1 | grep -q '^aws-cli/2\.'
      - name: Publish JD Cloud OSS artifacts
        timeout-minutes: 18
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          AWS_ACCESS_KEY_ID: ${{ secrets.JDOSS_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.JDOSS_SK }}
        run: python3 deploy/native/publish-oss.py --assets output --tag "$RELEASE_TAG"
  release:
    needs: [artifacts, oss, docker_hub]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 10
        with:
          artifact-ids: ${{ needs.artifacts.outputs.package_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.artifacts.outputs.ci_run_id }}
          merge-multiple: true
          path: output
      - name: Verify release checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 deploy/native/publish-oss.py --assets output --tag "$RELEASE_TAG" --dry-run
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" = *-* ]]; then release_flags=(--prerelease --latest=false); fi
          assets=()
          archive_names="$(python3 deploy/native/platforms.py --archives)"
          while IFS= read -r archive; do assets+=("output/$archive"); done <<< "$archive_names"
          for asset in "${assets[@]}"; do
            [[ -f "$asset" && ! -L "$asset" ]] || { echo "Missing release archive: $asset" >&2; exit 1; }
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            if [[ "$RELEASE_TAG" = *-* ]]; then gh release edit "$RELEASE_TAG" "${release_flags[@]}"; fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "OSS Transfer $RELEASE_TAG" --generate-notes "${release_flags[@]}"
          fi
