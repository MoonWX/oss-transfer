name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  jdcloud_publish:
    name: Build and publish in JD Cloud
    needs: verify
    runs-on: [self-hosted, linux, x64, "${{ vars.JD_PUBLISH_RUNNER_LABEL || 'jdcloud-publish' }}"]
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_JOB_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_CHECKOUT: release-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_JOB_LABEL: org.moonwx.oss-transfer.release=${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_IMAGE: oss-transfer:smoke-${{ github.run_id }}-${{ github.run_attempt }}
      JCR_IMAGE: moonwx-cn-north-1.jcr.service.jdcloud.com/osstransfer
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Initialize publishing workspace
        working-directory: ${{ github.workspace }}
        run: |
          release_state="$RUNNER_TEMP/oss-release-$RELEASE_JOB_KEY"
          docker_config="$RUNNER_TEMP/oss-docker-$RELEASE_JOB_KEY"
          mkdir -p "$release_state" "$docker_config"
          chmod 700 "$release_state" "$docker_config"
          printf 'RELEASE_STATE_DIR=%s\nDOCKER_CONFIG=%s\n' "$release_state" "$docker_config" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: ${{ env.RELEASE_CHECKOUT }}
      - name: Check publishing runner
        timeout-minutes: 3
        run: |
          for tool in bash git curl tar sha256sum openssl python3 mvn jq aws docker df; do
            command -v "$tool" >/dev/null || { echo "Missing runner tool: $tool" >&2; exit 1; }
          done
          [[ "$(uname -s)" = Linux && "$(uname -m)" = x86_64 ]]
          aws --version 2>&1 | grep -q '^aws-cli/2\.'
          docker info >/dev/null
          docker buildx version
          if [[ ! -r /proc/sys/fs/binfmt_misc/qemu-aarch64 ]] ||
             ! grep -qx enabled /proc/sys/fs/binfmt_misc/qemu-aarch64 ||
             ! grep -Eq '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64; then
            echo 'Prepare the runner ARM64 binfmt emulator (enabled, flags F) before publishing.' >&2
            exit 1
          fi
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          for directory in "$PWD" "$docker_root"; do
            available_kb="$(df -Pk "$directory" | awk 'END { print $4 }')"
            if [[ "$available_kb" -lt 10485760 ]]; then
              echo "Publishing needs at least 10 GiB free on $directory" >&2
              exit 1
            fi
          done
          mkdir -p "$RELEASE_STATE_DIR" "$DOCKER_CONFIG"
          chmod 700 "$RELEASE_STATE_DIR" "$DOCKER_CONFIG"
          # Only this run's checkout is cleared; persistent tool caches stay.
          rm -rf -- output
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Check release version
        run: |
          project_version="$(sed -n 's/^[[:space:]]*<version>\([^<]*\)<\/version>.*/\1/p' pom.xml | head -n1)"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?$ ]]
          test "$RELEASE_TAG" = "v$project_version"
          if [[ "$project_version" = *-* ]]; then
            IFS='.' read -r -a identifiers <<< "${project_version#*-}"
            for identifier in "${identifiers[@]}"; do
              [[ ! "$identifier" =~ ^0[0-9]+$ ]]
            done
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Check JD Cloud publishing credentials
        env:
          JDOSS_AK: ${{ secrets.JDOSS_AK }}
          JDOSS_SK: ${{ secrets.JDOSS_SK }}
          JCR_USERNAME: ${{ secrets.JCR_USERNAME }}
          JCR_PASSWD: ${{ secrets.JCR_PASSWD }}
        run: |
          for name in JDOSS_AK JDOSS_SK JCR_USERNAME JCR_PASSWD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
      - name: Build release
        run: ./build.sh
      - name: Docker master and agent smoke test
        timeout-minutes: 10
        run: |
          docker build --build-arg TARGETARCH=amd64 --label "$RELEASE_JOB_LABEL" -t "$SMOKE_IMAGE" .
          # Label this smoke test's containers, network and named volumes,
          # so cancellation cleanup also finds volumes without containers.
          RELEASE_DOCKER_BIN="$(command -v docker)"
          export RELEASE_DOCKER_BIN
          mkdir -p "$RELEASE_STATE_DIR/bin"
          cat > "$RELEASE_STATE_DIR/bin/docker" <<'DOCKER'
          #!/bin/bash
          set -euo pipefail
          if [[ "${1:-}" = network && "${2:-}" = create ]]; then
            shift 2
            exec "$RELEASE_DOCKER_BIN" network create --label "$RELEASE_JOB_LABEL" "$@"
          fi
          if [[ "${1:-}" = run ]]; then
            previous=''
            for argument in "$@"; do
              if [[ "$previous" = -v && "$argument" = oss-smoke-*:/app/data ]]; then
                "$RELEASE_DOCKER_BIN" volume create --label "$RELEASE_JOB_LABEL" "${argument%:/app/data}" >/dev/null
              fi
              previous="$argument"
            done
            shift
            exec "$RELEASE_DOCKER_BIN" run --label "$RELEASE_JOB_LABEL" "$@"
          fi
          exec "$RELEASE_DOCKER_BIN" "$@"
          DOCKER
          chmod +x "$RELEASE_STATE_DIR/bin/docker"
          PATH="$RELEASE_STATE_DIR/bin:$PATH" python3 deploy/tests/docker-agent-smoke.py --image "$SMOKE_IMAGE"
      - name: Set up isolated Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        id: buildx
        with:
          name: oss-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          use: false
          cleanup: true
          keep-state: false
          cache-binary: false
      - name: Log in to JD Cloud JCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: moonwx-cn-north-1.jcr.service.jdcloud.com
          username: ${{ secrets.JCR_USERNAME }}
          password: ${{ secrets.JCR_PASSWD }}
          logout: true
      - name: JCR tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: jcr_metadata
        with:
          images: moonwx-cn-north-1.jcr.service.jdcloud.com/osstransfer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Push JCR image
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.RELEASE_CHECKOUT }}
          file: ${{ env.RELEASE_CHECKOUT }}/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ${{ steps.jcr_metadata.outputs.tags }}
          labels: ${{ steps.jcr_metadata.outputs.labels }}
          provenance: false
          sbom: false
      - name: Verify JCR architectures and pull access
        timeout-minutes: 5
        run: |
          image="$JCR_IMAGE:${RELEASE_TAG#v}"
          docker buildx imagetools inspect "$image" --raw > "$RELEASE_STATE_DIR/jcr-manifest.json"
          jq -e '.mediaType == "application/vnd.docker.distribution.manifest.list.v2+json" and
            ([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]' \
            "$RELEASE_STATE_DIR/jcr-manifest.json" > /dev/null
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            printf '%s\n' "$image" > "$RELEASE_STATE_DIR/new-pull-image"
          fi
          docker pull --platform linux/amd64 "$image"
          docker pull --platform linux/arm64 "$image"
      - name: Publish JD Cloud OSS artifacts
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.JDOSS_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.JDOSS_SK }}
        run: bash deploy/publish-oss.sh "$RELEASE_TAG"
      - name: Upload compressed release package
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            ${{ github.workspace }}/${{ env.RELEASE_CHECKOUT }}/output/oss-transfer.tar.gz
            ${{ github.workspace }}/${{ env.RELEASE_CHECKOUT }}/output/oss-transfer.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Clean this publishing job's resources
        if: always()
        timeout-minutes: 3
        working-directory: ${{ github.workspace }}
        run: |
          # Login and Buildx actions perform their own post-job cleanup.
          # Keep DOCKER_CONFIG until those hooks finish; runner.temp is then
          # removed by the runner. Never prune global Docker state.
          cleanup_status=0
          if docker info >/dev/null 2>&1; then
            mapfile -t containers < <(docker ps -aq --filter "label=$RELEASE_JOB_LABEL")
            for container in "${containers[@]}"; do
              docker rm -f "$container" >/dev/null || cleanup_status=1
            done
            mapfile -t volumes < <(docker volume ls -q --filter "label=$RELEASE_JOB_LABEL")
            for volume in "${volumes[@]}"; do docker volume rm "$volume" >/dev/null || cleanup_status=1; done
            mapfile -t networks < <(docker network ls -q --filter "label=$RELEASE_JOB_LABEL")
            for network in "${networks[@]}"; do docker network rm "$network" >/dev/null || cleanup_status=1; done
            if docker image inspect "$SMOKE_IMAGE" >/dev/null 2>&1; then
              docker image rm "$SMOKE_IMAGE" >/dev/null || cleanup_status=1
            fi
            if [[ -f "$RELEASE_STATE_DIR/new-pull-image" ]]; then
              read -r image < "$RELEASE_STATE_DIR/new-pull-image"
              if docker image inspect "$image" >/dev/null 2>&1; then
                docker image rm "$image" >/dev/null || cleanup_status=1
              fi
            fi
          fi
          rm -rf -- "${GITHUB_WORKSPACE:?}/${RELEASE_CHECKOUT:?}" "${RELEASE_STATE_DIR:?}" || cleanup_status=1
          exit "$cleanup_status"
  docker_hub:
    name: Publish Docker Hub from the release package
    needs: jdcloud_publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: output
      - name: Verify and unpack the release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd output && sha256sum --check oss-transfer.tar.gz.sha256)
          tar -xzf output/oss-transfer.tar.gz --no-same-owner --no-same-permissions -C output
          test "$(sed -n 's/^Version: //p' output/oss-transfer/VERSION)" = "${RELEASE_TAG#v}"
          package_commit="$(sed -n 's/^Commit: //p' output/oss-transfer/VERSION)"
          test "$(git rev-parse "$package_commit^{commit}")" = "$(git rev-parse HEAD)"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        id: buildx
        with:
          cleanup: true
          keep-state: false
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}
          logout: true
      - name: Docker Hub tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: moonwx/osstransfer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Push Docker Hub image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
  release:
    needs: [jdcloud_publish, docker_hub]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: output
      - name: Verify release checksum
        run: cd output && sha256sum --check oss-transfer.tar.gz.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" = *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" output/oss-transfer.tar.gz output/oss-transfer.tar.gz.sha256 --clobber
            if [[ "$RELEASE_TAG" = *-* ]]; then
              gh release edit "$RELEASE_TAG" "${release_flags[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" output/oss-transfer.tar.gz output/oss-transfer.tar.gz.sha256 \
              --verify-tag --title "OSS Transfer $RELEASE_TAG" --generate-notes "${release_flags[@]}"
          fi
