transfer.agent.master-url: ${TRANSFER_AGENT_MASTER_URL:}
transfer.agent.join-token: ${TRANSFER_AGENT_JOIN_TOKEN:}
transfer.agent.address: ${TRANSFER_AGENT_ADDRESS:}
transfer.agent.label: ${TRANSFER_AGENT_LABEL:}
transfer.agent.package-path: /opt/oss-transfer/agent-bundle.tar.gz
transfer.tmp-dir: /app/data/tmp-objects
rocksdb.path: /app/data/rocksdb
logging.path: /app/data/logs
logging.file: /app/data/logs/oss-transfer.log
